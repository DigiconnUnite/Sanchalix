name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Enough for the app to start and build. Tests start their own database and secrets (tests/globalSetup.ts).
      APP_URL: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/ci
      AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
